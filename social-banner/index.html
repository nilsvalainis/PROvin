<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROVIN.LV — thumbnail baneris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --provin-accent: #0066ff;
      --provin-danger: #ff3b30;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      background: #121418;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2.5rem 1.25rem 3rem;
    }

    /* 1200×630 — FB / LinkedIn / blog thumbnail */
    .banner {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #030304;
      box-shadow: 0 0 0 1px rgb(255 255 255 / 0.06), 0 24px 60px rgb(0 0 0 / 0.5);
    }

    .banner-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 70% at 50% 55%, rgb(0 102 255 / 0.18), transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 15%, rgb(255 59 48 / 0.12), transparent 50%),
        #030304;
    }

    .inner {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 40px 56px 48px;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .brand .vin { color: var(--provin-accent); }

    .tag {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgb(255 255 255 / 0.45);
    }

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      gap: 0.12em;
    }

    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    .line {
      margin: 0;
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.92;
      text-transform: uppercase;
    }

    .line-lead {
      font-size: 72px;
      color: #fff;
    }

    .line-danger {
      font-size: 72px;
      color: var(--provin-danger);
    }

    .line-money {
      font-size: 120px;
      letter-spacing: -0.06em;
      color: var(--provin-danger);
      text-shadow: 0 0 60px rgb(255 59 48 / 0.35);
    }

    .cta-row {
      display: flex;
      justify-content: center;
    }

    .cta {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--provin-accent);
    }

    #download-btn {
      appearance: none;
      border: 1px solid #0052cc;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.75rem;
      padding: 0.9rem 1.5rem;
      color: #fff;
      background: var(--provin-accent);
    }

    #download-btn:disabled { opacity: 0.65; cursor: wait; }

    .hint {
      font-size: 0.85rem;
      color: rgb(255 255 255 / 0.5);
      text-align: center;
    }

    body.capturing .page > :not(#banner) { display: none !important; }
    body.capturing { background: transparent; min-height: 0; }
    body.capturing .page { padding: 0; gap: 0; }
    body.capturing .banner { box-shadow: none; }
  </style>
</head>
<body>
  <div class="page">
    <div id="banner" class="banner" data-banner>
      <div class="banner-bg" aria-hidden="true"></div>
      <div class="inner">
        <div class="top">
          <div class="brand"><span>PRO</span><span class="vin">VIN</span><span>.LV</span></div>
          <div class="tag">mobile.de</div>
        </div>

        <div class="center">
          <h1 class="stack">
            <span class="line line-lead">Kā mēs gandrīz</span>
            <span class="line line-danger">„zaudējām”</span>
            <span class="line line-money">48 000 €</span>
          </h1>
        </div>

        <div class="cta-row">
          <div class="cta">Lasi blogā → PROVIN.LV</div>
        </div>
      </div>
    </div>

    <button id="download-btn" type="button">Lejupielādēt JPG</button>
    <p class="hint">Atver pārlūkā → nospied pogu, vai <code>node generate.js</code></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const banner = document.getElementById('banner');
    const btn = document.getElementById('download-btn');

    async function renderBannerCanvas() {
      return html2canvas(banner, {
        scale: 2,
        width: 1200,
        height: 630,
        backgroundColor: '#030304',
        useCORS: true,
        allowTaint: true,
        logging: false,
      });
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = 'Ģenerē…';
      try {
        const canvas = await renderBannerCanvas();
        const a = document.createElement('a');
        a.download = 'banner.jpg';
        a.href = canvas.toDataURL('image/jpeg', 0.95);
        a.click();
      } catch (e) {
        console.error(e);
        alert('Neizdevās ģenerēt attēlu.');
      } finally {
        btn.disabled = false;
        btn.textContent = prev;
      }
    });

    window.__renderBannerJpg = async function () {
      document.body.classList.add('capturing');
      try {
        return (await renderBannerCanvas()).toDataURL('image/jpeg', 0.95);
      } finally {
        document.body.classList.remove('capturing');
      }
    };
  </script>
</body>
</html>
