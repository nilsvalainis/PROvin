<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>PROVIN - dīlera kartīte, rūpīgā kārta</title>
<style>
  :root{
    --ink:#f1f5f9;
    --sub:rgb(203 213 225 / .88);
    --mute:rgb(148 163 184 / .9);
    --g:rgb(167 243 208 / .95);
    --blue:#2563eb;
    --blue2:#60a5fa;
    --hair:rgb(255 255 255 / .1);
    --stage:13.5rem;
    --glass:rgb(255 255 255 / .03);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;color:var(--ink);background:#0d0d0d;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .nav{
    position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:.28rem;align-items:center;
    padding:.65rem 1.1rem;background:rgb(8 8 8 / .94);border-bottom:1px solid var(--hair);
  }
  .nav strong{margin-right:.4rem;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:#93c5fd;}
  .nav a{font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none;padding:.26rem .36rem;}
  .nav a:hover{color:#93c5fd;}
  .intro{max-width:48rem;margin:0 auto;padding:1.4rem 1.3rem .2rem;}
  .intro b{display:block;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#93c5fd;}
  .intro h1{margin:.3rem 0 0;font-size:1.2rem;font-weight:600;}
  .intro p{margin:.4rem 0 0;font-size:.82rem;line-height:1.5;color:var(--mute);}
  .grid{max-width:74rem;margin:0 auto;padding:.4rem 1.3rem 2.8rem;display:grid;gap:1.15rem;}
  @media(min-width:960px){.grid{grid-template-columns:1fr 1fr;}}
  .cell{border:1px solid var(--hair);border-radius:.85rem;background:#111;padding:.75rem .8rem .9rem;}
  .cap b{display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:#93c5fd;}
  .cap i{display:block;margin:.18rem 0 .55rem;font-style:normal;font-size:.72rem;line-height:1.42;color:var(--mute);}
  .stage{
    height:var(--stage);border-radius:16px;border:1px solid rgb(255 255 255 / .08);
    background:var(--glass);overflow:hidden;position:relative;display:flex;flex-direction:column;
  }
  .viz{flex:1 1 auto;min-height:0;position:relative;}
  .foot{flex:0 0 auto;padding:.42rem .72rem .5rem;border-top:1px solid var(--hair);}
  .t{margin:0;font-size:.82rem;font-weight:650;line-height:1.3;color:#f1f5f9;}
  .s{margin:.14rem 0 0;font-size:.74rem;font-weight:450;line-height:1.32;color:var(--sub);}
  .g{
    display:inline-flex;align-items:center;gap:.32rem;margin:.28rem 0 0;
    font-size:.76rem;font-weight:700;line-height:1.3;color:var(--g);
  }
  .ii{
    display:inline-flex;align-items:center;justify-content:center;width:.9rem;height:.9rem;
    border:1px solid rgb(148 163 184 / .4);border-radius:999px;
    background:rgb(15 23 42 / .52);font-size:.52rem;font-weight:700;color:#e2e8f0;
  }
  img.logo{display:block;width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1);}

  /* 57 ledger */
  .ledger{height:100%;padding:.45rem .72rem 0;display:flex;flex-direction:column;}
  .ledger .h{
    display:grid;grid-template-columns:5.1rem 1fr;gap:.5rem;
    font-size:.48rem;letter-spacing:.14em;text-transform:uppercase;color:#64748b;padding:0 0 .22rem;
    border-bottom:1px solid rgb(37 99 235 / .45);
  }
  .ledger .r{
    display:grid;grid-template-columns:5.1rem 1fr;gap:.5rem;align-items:center;
    font-size:.68rem;font-variant-numeric:tabular-nums;color:#cbd5e1;padding:.28rem .1rem;
    border-bottom:1px solid rgb(255 255 255 / .05);
  }
  .ledger .r:nth-child(odd){background:rgb(255 255 255 / .02);}
  .ledger .r em{font-style:normal;color:#93c5fd;font-weight:600;}
  .bar{height:3px;border-radius:99px;background:rgb(37 99 235 / .22);position:relative;overflow:hidden;}
  .bar i{position:absolute;inset:0 auto 0 0;background:#2563eb;border-radius:99px;}

  /* 58 mosaic */
  .v58{padding:0;}
  .v58 .foot{
    position:absolute;left:0;right:0;bottom:0;z-index:2;border-top:0;
    background:linear-gradient(180deg, transparent, rgb(12 14 18 / .88) 28%, rgb(12 14 18 / .97));
    padding:1.1rem .72rem .5rem;
  }
  .mosaic{
    position:absolute;inset:0 0 3.6rem;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr);
    gap:.28rem;padding:.45rem .5rem .2rem;
  }
  .mosaic span{
    display:grid;place-items:center;padding:.12rem;border-radius:.22rem;background:rgb(255 255 255 / .03);
  }
  .mosaic img{width:1.05rem;height:1.05rem;opacity:.62;}

  /* 59 book */
  .book{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:0;padding:.4rem .5rem 0;}
  .page{
    border:1px solid rgb(255 255 255 / .08);background:rgb(255 255 255 / .025);padding:.4rem .45rem;
  }
  .page:first-child{border-radius:.35rem 0 0 .35rem;border-right:0;}
  .page:last-child{border-radius:0 .35rem .35rem 0;}
  .lines{display:flex;flex-direction:column;gap:.38rem;padding-top:.15rem;}
  .lines b{display:block;height:1px;background:rgb(148 163 184 / .22);font-size:0;}
  .lines b:nth-child(2){width:86%;} .lines b:nth-child(3){width:74%;} .lines b:nth-child(4){width:91%;}
  .stamps{height:100%;display:flex;align-items:center;justify-content:center;gap:.35rem;}
  .stamps i{
    width:1.85rem;height:1.85rem;border-radius:50%;border:1px solid rgb(96 165 250 / .4);
    display:grid;place-items:center;opacity:.8;
  }
  .stamps img{width:1.05rem;height:1.05rem;opacity:.85;}

  /* 60 fan */
  .fan{height:100%;display:flex;align-items:flex-end;justify-content:center;padding:0 1.2rem .15rem;}
  .fan .card{
    width:3.15rem;height:4.35rem;margin:0 -.55rem;border-radius:.4rem;
    border:1px solid rgb(255 255 255 / .14);background:linear-gradient(180deg,rgb(255 255 255 / .07),rgb(255 255 255 / .02));
    display:grid;place-items:center;transform-origin:50% 110%;
    box-shadow:0 10px 18px rgb(0 0 0 / .35);
  }
  .fan .card img{width:1.55rem;height:1.55rem;opacity:.8;}
  .fan .card:nth-child(1){transform:rotate(-16deg) translateY(.35rem);}
  .fan .card:nth-child(2){transform:rotate(-8deg) translateY(.12rem);}
  .fan .card:nth-child(3){transform:rotate(0deg) translateY(-.12rem);border-color:rgb(96 165 250 / .4);z-index:2;}
  .fan .card:nth-child(4){transform:rotate(8deg) translateY(.12rem);}
  .fan .card:nth-child(5){transform:rotate(16deg) translateY(.35rem);}

  /* 61 HUD */
  .hud{height:100%;display:grid;place-items:center;padding:.15rem 0 0;}
  .hud svg{width:7.2rem;height:4.6rem;display:block;}

  /* 62 sheets */
  .sheets{height:100%;position:relative;}
  .sheet{
    position:absolute;left:12%;right:12%;height:4.4rem;border-radius:.28rem;
    border:1px solid rgb(255 255 255 / .12);background:rgb(255 255 255 / .04);
  }
  .sheet.a{top:.85rem;transform:rotate(-4.5deg);opacity:.4;}
  .sheet.b{top:.7rem;transform:rotate(3.2deg);opacity:.55;}
  .sheet.c{top:.45rem;transform:rotate(-.4deg);padding:.45rem .55rem;opacity:1;background:rgb(18 22 30 / .92);}
  .sheet.c .row{display:flex;justify-content:space-between;font-size:.6rem;font-variant-numeric:tabular-nums;color:#94a3b8;padding:.12rem 0;border-bottom:1px solid rgb(255 255 255 / .06);}
  .sheet.c .row b{color:#e2e8f0;font-weight:600;}

  /* 63 calendar */
  .cal{height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:.28rem;padding:.4rem .55rem 0;}
  .mo{
    border:1px solid rgb(255 255 255 / .07);border-radius:.28rem;padding:.18rem .16rem .14rem;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .mo u{font-size:.48rem;letter-spacing:.08em;text-transform:uppercase;color:#64748b;text-decoration:none;}
  .dots{display:flex;gap:.12rem;flex-wrap:wrap;}
  .dots i{width:4px;height:4px;border-radius:50%;background:rgb(148 163 184 / .25);display:block;}
  .dots i.on{background:#60a5fa;box-shadow:0 0 0 2px rgb(37 99 235 / .2);}

  /* 64 coverage */
  .cov{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 .72rem;gap:.42rem;}
  .meter{display:flex;height:.72rem;border-radius:99px;overflow:hidden;background:rgb(255 255 255 / .04);}
  .meter .f{width:45.83%;background:#2563eb;}
  .meter .w{width:29.17%;background:rgb(96 165 250 / .55);}
  .meter .l{width:25%;background:rgb(148 163 184 / .28);}
  .leg{display:flex;gap:.85rem;font-size:.58rem;color:#94a3b8;}
  .leg b{color:#e2e8f0;font-weight:650;}
  .leg i{display:inline-block;width:.45rem;height:.45rem;border-radius:99px;margin-right:.28rem;vertical-align:-1px;}
  .leg .f i{background:#2563eb;} .leg .w i{background:#60a5fa;} .leg .l i{background:#64748b;}

  /* 65 receipts */
  .recs{height:100%;position:relative;}
  .rec{
    position:absolute;width:7.4rem;border-radius:.12rem;padding:.4rem .45rem .35rem;
    background:repeating-linear-gradient(180deg, rgb(255 255 255 / .045) 0 11px, rgb(255 255 255 / .02) 11px 12px);
    border:1px solid rgb(255 255 255 / .1);font-variant-numeric:tabular-nums;
    box-shadow:0 8px 16px rgb(0 0 0 / .28);
  }
  .rec .k{font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin-bottom:.2rem;}
  .rec .n{font-size:.7rem;font-weight:650;color:#e2e8f0;}
  .rec .m{margin-top:.12rem;font-size:.62rem;color:#93c5fd;}
  .rec.one{left:1.05rem;top:.55rem;transform:rotate(-6deg);}
  .rec.two{left:3.3rem;top:1.15rem;transform:rotate(4deg);z-index:2;border-color:rgb(96 165 250 / .28);}

  /* 66 tiles */
  .tiles{height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:.32rem;padding:.4rem .55rem 0;}
  .tile{
    border:1px solid rgb(255 255 255 / .08);border-radius:.4rem;background:rgb(255 255 255 / .03);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12rem;text-align:center;
  }
  .tile b{font-size:.92rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:#f1f5f9;}
  .tile u{font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;color:#64748b;text-decoration:none;}
  .tile img{width:1.35rem;height:1.35rem;opacity:.75;}

  /* 67 net */
  .net{height:100%;display:grid;place-items:center;}
  .net svg{width:100%;height:100%;display:block;}

  /* 68 last row */
  .last{height:100%;padding:.45rem .65rem 0;display:flex;flex-direction:column;gap:.28rem;}
  .ghost{opacity:.28;font-size:.62rem;font-variant-numeric:tabular-nums;color:#94a3b8;display:flex;justify-content:space-between;padding:.08rem .1rem;}
  .hit{
    display:flex;align-items:center;justify-content:space-between;gap:.5rem;
    padding:.38rem .5rem;border-radius:.45rem;border:1px solid rgb(37 99 235 / .4);
    background:rgb(37 99 235 / .12);
  }
  .hit b{font-size:.78rem;font-weight:650;font-variant-numeric:tabular-nums;}
  .hit span{font-size:.62rem;color:#93c5fd;}
  .seal{
    width:1.7rem;height:1.7rem;border-radius:50%;border:1px solid rgb(96 165 250 / .5);
    display:grid;place-items:center;flex-shrink:0;
  }
  .seal img{width:1rem;height:1rem;opacity:.9;}
</style>
</head>
<body>
<nav class="nav">
  <strong>Rūpīgā kārta</strong>
  <a href="#r57">57</a><a href="#r58">58</a><a href="#r59">59</a><a href="#r60">60</a>
  <a href="#r61">61</a><a href="#r62">62</a><a href="#r63">63</a><a href="#r64">64</a>
  <a href="#r65">65</a><a href="#r66">66</a><a href="#r67">67</a><a href="#r68">68</a>
</nav>
<div class="intro">
  <b>Hero · Dīlera dati</b>
  <h1>Divpadsmit atšķirīgas kompozīcijas, viens ritms</h1>
  <p>Katrai ir vizuālā zona un fiksēta kājene ar tām pašām trim rindām. Palete: slāts, zils, mint. Fona skaitļi ir atskaites forma, ne jauns teksts.</p>
</div>
<div class="grid" id="grid"></div>
<script>
const LOGOS = ["mercedes","bmw","audi","volkswagen","porsche","toyota","lexus","volvo","mini","jaguar","land-rover","bentley","lamborghini","skoda","seat","cupra","ford","mazda","nissan","infiniti","opel","vauxhall","peugeot","citroen","renault","dacia","fiat","alfa-romeo","jeep","hyundai","kia","honda","subaru","suzuki","mitsubishi","polestar","smart","abarth","lancia","ds","genesis","ferrari","maserati","aston-martin","lotus","mg","alpine","rolls-royce"];
const src = (id) => `/public/brand-logos/${id}.svg`;
const img = (id, extra="") => `<img class="logo" src="${src(id)}" alt="" ${extra}>`;
const TITLE = "Dīleru servisa vēsture un nobraukums";
const SUB = "Tiešā piekļuve oficiālajiem ražotāja apkopju ierakstiem.";
const G = `100% Naudas atmaksas garantija. <span class="ii">i</span>`;
const foot = () => `<div class="foot"><p class="t">${TITLE}</p><p class="s">${SUB}</p><p class="g">${G}</p></div>`;

const items = [
  ["57 · Izraksts","FSH rinda, tīrāk: datums un km, zila galvene, josla kā apjoms.","", `
    <div class="viz"><div class="ledger">
      <div class="h"><span>Datums</span><span>Km</span></div>
      <div class="r"><em>12.03.2024</em><span>142 300<div class="bar" style="margin-top:.18rem"><i style="width:92%"></i></div></span></div>
      <div class="r"><em>04.09.2023</em><span>128 110<div class="bar" style="margin-top:.18rem"><i style="width:78%"></i></div></span></div>
      <div class="r"><em>18.02.2023</em><span>114 050<div class="bar" style="margin-top:.18rem"><i style="width:64%"></i></div></span></div>
    </div></div>${foot()}`],

  ["58 · Mozaīka","48 zīmes šūnās, ne izkaisītas. Teksts uz gradienta.","v58", `
    <div class="viz"><div class="mosaic" data-fill="48"></div></div>${foot()}`],

  ["59 · Servisa grāmata","Kreisā lapa ir rindas. Labā ir trīs ražotāja spiedogi.","", `
    <div class="viz"><div class="book">
      <div class="page"><div class="lines"><b></b><b></b><b></b><b></b><b></b></div></div>
      <div class="page"><div class="stamps">${["bmw","mercedes","audi"].map(id=>`<i>${img(id)}</i>`).join("")}</div></div>
    </div></div>${foot()}`],

  ["60 · Kavas","Ražotāji kā kāršu vēdeklis. Vidējā ir aktīvā.","", `
    <div class="viz"><div class="fan">${["toyota","volkswagen","bmw","mercedes","porsche"].map(id=>`<div class="card">${img(id)}</div>`).join("")}</div></div>${foot()}`],

  ["61 · HUD","Cockpit loka skala. Nobraukums kā instrumentu panelis.","", `
    <div class="viz"><div class="hud"><svg viewBox="0 0 160 92" aria-hidden>
      <path d="M18 78 A 62 62 0 0 1 142 78" fill="none" stroke="rgba(148,163,184,.22)" stroke-width="6" stroke-linecap="round"/>
      <path d="M18 78 A 62 62 0 0 1 118 28" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
      <circle cx="118" cy="28" r="3.2" fill="#93c5fd"/>
      <text x="80" y="64" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="650" font-family="Inter,sans-serif">186 420</text>
      <text x="80" y="76" text-anchor="middle" fill="#64748b" font-size="6" letter-spacing="1.6">KM</text>
    </svg></div></div>${foot()}`],

  ["62 · Atskaišu slāņi","Trīs lapas, kā PDF, ko dīleris izdrukā. Augšējā ir lasāma.","", `
    <div class="viz"><div class="sheets">
      <div class="sheet a"></div><div class="sheet b"></div>
      <div class="sheet c">
        <div class="row"><span>12.03.2024</span><b>142 300 km</b></div>
        <div class="row"><span>04.09.2023</span><b>128 110 km</b></div>
        <div class="row"><span>18.02.2023</span><b>114 050 km</b></div>
      </div>
    </div></div>${foot()}`],

  ["63 · Kalendārs","Gads kā režģis. Zilie punkti ir fiksētās apkopes.","", `
    <div class="viz"><div class="cal" id="cal"></div></div>${foot()}`],

  ["64 · Seguma josla","22 full, 14 workshop, 12 limited. Segums kā mērierīce, ne saraksts.","", `
    <div class="viz"><div class="cov">
      <div class="meter"><span class="f"></span><span class="w"></span><span class="l"></span></div>
      <div class="leg">
        <span class="f"><i></i><b>22</b> pilna</span>
        <span class="w"><i></i><b>14</b> atzīmes</span>
        <span class="l"><i></i><b>12</b> ierobežots</span>
      </div>
    </div></div>${foot()}`],

  ["65 · Dīlera čeki","Divas nobīdītas kvītis. Fizisks servisa dokuments.","", `
    <div class="viz"><div class="recs">
      <div class="rec one"><div class="k">Serviss</div><div class="n">04.09.2023</div><div class="m">128 110 km</div></div>
      <div class="rec two"><div class="k">Serviss</div><div class="n">12.03.2024</div><div class="m">142 300 km</div></div>
    </div></div>${foot()}`],

  ["66 · Trīs lauki","Datums, km, ražotājs kā spec šūnas. Tāda pati valoda kā auto konfigurators.","", `
    <div class="viz"><div class="tiles">
      <div class="tile"><b>12.03</b><u>datums</u></div>
      <div class="tile"><b>142k</b><u>km</u></div>
      <div class="tile">${img("bmw")}<u>oem</u></div>
    </div></div>${foot()}`],

  ["67 · Tīkls","Dīleru mezgli, ne globuss. Vaicājums iet pa ražotāja sistēmu.","", `
    <div class="viz"><div class="net"><svg viewBox="0 0 320 110" aria-hidden>
      <g stroke="#2563eb" stroke-width="1.1" fill="none" opacity=".7">
        <line x1="48" y1="62" x2="110" y2="32"/><line x1="110" y1="32" x2="168" y2="58"/>
        <line x1="168" y1="58" x2="232" y2="28"/><line x1="168" y1="58" x2="250" y2="78"/>
        <line x1="110" y1="32" x2="90" y2="88"/><line x1="48" y1="62" x2="90" y2="88"/>
      </g>
      <g fill="#0f172a" stroke="#60a5fa" stroke-width="1.3">
        <circle cx="48" cy="62" r="8"/><circle cx="110" cy="32" r="9"/><circle cx="168" cy="58" r="10"/>
        <circle cx="232" cy="28" r="8"/><circle cx="250" cy="78" r="8"/><circle cx="90" cy="88" r="7"/>
      </g>
    </svg></div></div>${foot()}`],

  ["68 · Pēdējā rinda","Vecākie ieraksti paliek ēnā. Aktīvais ir izcelts ar ražotāja zīmogu.","", `
    <div class="viz"><div class="last">
      <div class="ghost"><span>18.02.2023</span><span>114 050</span></div>
      <div class="ghost"><span>04.09.2023</span><span>128 110</span></div>
      <div class="hit">
        <div><b>12.03.2024</b><div><span>142 300 km</span></div></div>
        <div class="seal">${img("bmw")}</div>
      </div>
    </div></div>${foot()}`],
];

document.getElementById("grid").innerHTML = items.map((it,i)=>`
  <section class="cell" id="r${57+i}">
    <div class="cap"><b>${it[0]}</b><i>${it[1]}</i></div>
    <div class="stage ${it[2]}">${it[3]}</div>
  </section>`).join("");

document.querySelectorAll("[data-fill]").forEach((el)=>{
  el.innerHTML = LOGOS.slice(0, Number(el.dataset.fill)).map((id)=>`<span>${img(id)}</span>`).join("");
});
const cal = document.getElementById("cal");
if (cal) {
  const months = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
  const on = {2:[1,4], 5:[2], 8:[0,3], 10:[1]};
  cal.innerHTML = months.map((m,i)=>{
    const dots = [0,1,2,3].map((d)=>`<i class="${(on[i]||[]).includes(d)?"on":""}"></i>`).join("");
    return `<div class="mo"><u>${m}</u><div class="dots">${dots}</div></div>`;
  }).join("");
}
</script>
</body>
</html>
