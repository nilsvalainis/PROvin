<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>PROVIN B2B ielogotais · 11-20 (PROVIN UI)</title>
<style>
  :root{
    --ink:#fafafc; --dim:rgb(210 214 222 / .9); --mute:#a1a1aa; --faint:#71717a;
    --line:rgb(255 255 255 / .1); --accent:#2563eb; --pad:max(1rem,env(safe-area-inset-left));
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:#050505;
    background-image:
      radial-gradient(ellipse 120% 70% at 50% -8%, rgb(255 255 255 / .04) 0%, transparent 55%),
      linear-gradient(180deg,#141414 0%,#0a0a0a 40%,#000 100%);
    background-attachment:fixed;
  }
  .page{max-width:78rem;margin:0 auto;padding:1.2rem var(--pad) 4rem}
  h1{margin:0 0 .35rem;font-size:1.15rem;letter-spacing:-.02em}
  .lead{margin:0 0 1rem;color:var(--faint);font-size:.84rem;line-height:1.45;max-width:54rem}
  .toc{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1.3rem}
  .toc a{
    display:inline-flex;align-items:center;min-height:1.9rem;padding:0 .65rem;
    border:1px solid var(--line);border-radius:999px;color:#93c5fd;text-decoration:none;
    font-size:.52rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  }
  .section{margin:0 0 2.6rem;padding-top:1.1rem;border-top:1px solid var(--line)}
  .section>h2{margin:0 0 .25rem;font-size:.98rem}
  .why{margin:0 0 .9rem;color:var(--faint);font-size:.78rem;line-height:1.45;max-width:48rem}
  .pair{display:grid;gap:1rem}
  @media(min-width:980px){.pair{grid-template-columns:1fr 22rem;align-items:start}}
  .stage{
    border:1px solid rgb(255 255 255 / .12);border-radius:1rem;
    background:rgb(10 10 10 / .96);padding:1.1rem 1.15rem 1.25rem;
  }
  .phone-frame{
    border:1px solid rgb(255 255 255 / .14);border-radius:1.35rem;
    background:#0a0a0a;padding:.55rem;max-width:22rem;margin:0 auto;
  }
  .phone-inner{
    border:1px solid rgb(255 255 255 / .08);border-radius:1.05rem;
    padding:.85rem .8rem 1.1rem;min-height:26rem;background:#070707;
  }
  .device{margin:0 0 .55rem;font-size:.55rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#93c5fd}
  .badge{
    display:inline-block;margin:0 0 .7rem;padding:.18rem .45rem;border-radius:.3rem;
    background:rgb(255 255 255 / .06);color:#d4d4d8;font-size:.52rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  }

  .nav{display:flex;gap:.85rem;flex-wrap:wrap;margin:0 0 .9rem;padding-bottom:.75rem;border-bottom:1px solid var(--line);align-items:baseline}
  .nav a{
    font-size:.62rem;font-weight:650;letter-spacing:.14em;text-transform:uppercase;
    color:#71717a;text-decoration:none;
  }
  .nav a.on{color:#f4f4f5}
  .h{margin:0;font-size:1.25rem;font-weight:600;letter-spacing:-.02em;line-height:1.25}
  .h .b{color:var(--accent)}
  .sub{margin:.35rem 0 0;color:var(--mute);font-size:.78rem;line-height:1.45}
  .lab{display:block;margin:0 0 .28rem;font-size:.56rem;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:#71717a}
  .field{
    width:100%;min-height:2.7rem;margin:0 0 .65rem;padding:.55rem .7rem;
    border:1px solid rgb(255 255 255 / .14);border-radius:.65rem;
    background:rgb(8 10 14 / .55);color:#fff;font:1rem/1.3 Inter,sans-serif;
  }
  .cta{
    display:flex;align-items:center;justify-content:center;width:100%;min-height:3.35rem;
    border:1px solid rgb(255 255 255 / .12);border-radius:999px;color:#fff;margin-top:.45rem;
    background:linear-gradient(180deg,#1a6fd4 0%,#1459ad 100%);
    font:650 .72rem/1 Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;
  }
  .cta.ghost{
    background:transparent;color:#93c5fd;
  }
  .pack-row{display:grid;gap:.55rem;margin:.75rem 0}
  @media(min-width:700px){.desk .pack-row{grid-template-columns:1fr 1fr}}
  .pack{
    border:1px solid var(--line);border-radius:.9rem;padding:.85rem .9rem;text-align:left;
    background:rgb(9 9 11 / .7);color:inherit;width:100%;
  }
  .pack.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:rgb(37 99 235 / .1)}
  .pack .qty{font-size:.56rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .pack .unit{margin-top:.3rem;font-size:1.25rem;font-weight:650;letter-spacing:-.02em}
  .pack .unit .suf{margin-left:.25rem;font-size:.58rem;font-weight:500;color:var(--faint)}
  .pack .tot{margin-top:.15rem;font-size:.62rem;color:var(--faint)}
  .split{display:grid;gap:1.1rem}
  @media(min-width:860px){.desk .split{grid-template-columns:1fr 1fr;align-items:start}}
  .rule{height:1px;background:var(--line);border:0;margin:1rem 0}
  .remain-inline{color:#93c5fd;font-weight:550}
  .remain-quiet{color:var(--mute);font-size:.78rem}
  .remain-nav{margin-left:auto;font-size:.62rem;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
  .remain-nav b{color:#f4f4f5;font-weight:650;letter-spacing:0;text-transform:none}
  .bar{
    display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;
    margin:0 0 1rem;padding:.55rem 0;border-bottom:1px solid var(--line);
    font-size:.78rem;color:var(--mute);
  }
  .bar b{color:#f4f4f5;font-weight:600}
  .footbar{
    margin-top:1rem;padding-top:.85rem;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;
    font-size:.72rem;color:var(--mute);
  }
  .list-line{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid rgb(255 255 255 / .06);font-size:.82rem}
  .list-line .u{font-weight:650}
  .list-line .tot{font-size:.62rem;color:var(--faint);font-weight:400}
</style>
</head>
<body>
<div class="page">
  <h1>Ielogotais B2B · 11-20. tajā pašā PROVIN UI</h1>
  <p class="lead">
    Tikai izkārtojums mainās. Fonts, tumšais fons, zilais CTA, navigācija, lauki - kā live partneru kontā.
    Pilnie skati A/B/C (0 / ≥1 / dīleris ON) + admin:
    <a href="b2b-logged-in-states-abc.html" style="color:#93c5fd">atvērt skatus A/B/C</a>.
    <a href="b2b-logged-in-audits-only-10.html" style="color:#93c5fd">1-10</a>
  </p>
  <nav class="toc">
    <a href="#v11">11</a><a href="#v12">12</a><a href="#v13">13</a><a href="#v14">14</a>
    <a href="#v15">15</a><a href="#v16">16</a><a href="#v17">17</a><a href="#v18">18</a>
    <a href="#v19">19</a><a href="#v20">20</a>
  </nav>
  <div id="root"></div>
</div>
<script>
function nav(active, extra=""){
  return `<div class="nav">
    <a class="${active==="Sākums"?"on":""}" href="#">Sākums</a>
    <a class="${active==="Atskaites"?"on":""}" href="#">Atskaites</a>
    <a class="${active==="Profils"?"on":""}" href="#">Profils</a>
    ${extra}
  </div>`;
}
function packs(sel=1){
  return `<div class="pack-row">
    <div class="pack ${sel===0?"on":""}"><div class="qty">1 atskaite</div><div class="unit">79,99 €<span class="suf">/ gab.</span></div></div>
    <div class="pack ${sel===1?"on":""}"><div class="qty">10 atskaites</div><div class="unit">69,99 €<span class="suf">/ gab.</span></div><div class="tot">Kopā 699,90 €</div></div>
  </div>`;
}

const V = [
  {
    id:"11",
    title:"11. Atlikums virsrakstā",
    why:"„Iesniegt VIN · 7 palikušas” - viens H1, bez atsevišķa atlikuma bloka.",
    desk(){return `${nav("Sākums")}
      <h2 class="h">Iesniegt VIN <span class="remain-quiet">· 7 palikušas</span></h2>
      <span class="lab">VIN</span><input class="field" value="WVWZZZ3CZWE123456"/>
      <button type="button" class="cta">Iesniegt</button>
      <button type="button" class="cta ghost">Pirkt vēl atskaites</button>`},
    phone(){return `${nav("Sākums")}
      <h2 class="h">Iesniegt VIN <span class="remain-quiet">· 7</span></h2>
      <span class="lab">VIN</span><input class="field"/>
      <button type="button" class="cta">Iesniegt</button>`},
  },
  {
    id:"12",
    title:"12. Atlikums navigācijā",
    why:"Kā trešais meta blakus Profils: „Audits 7”. Vienmēr redzams visās sadaļās.",
    desk(){return `${nav("Sākums", `<span class="remain-nav">Audits <b>7</b></span>`)}
      <h2 class="h">Iesniegt VIN</h2>
      <span class="lab">VIN</span><input class="field" value="WVWZZZ3CZWE123456"/>
      <button type="button" class="cta">Iesniegt</button>`},
    phone(){return `${nav("Sākums", `<span class="remain-nav">Audits <b>7</b></span>`)}
      <span class="lab">VIN</span><input class="field"/>
      <button type="button" class="cta">Iesniegt</button>`},
  },
  {
    id:"13",
    title:"13. Viena statusa rinda zem nav",
    why:"Pilna platuma rinda, teksts: palikušas 7 Audita atskaites. Nav kartīšu.",
    desk(){return `${nav("Atskaites")}
      <div class="bar"><span>Palikušas <b>7</b> Audita atskaites</span><span>Dīlera paka nav šajā kontā</span></div>
      <h2 class="h">Pirkt atskaites</h2>
      ${packs(1)}
      <button type="button" class="cta">Pasūtīt atskaites 699,90 €</button>`},
    phone(){return `${nav("Atskaites")}
      <div class="bar"><span>Palikušas <b>7</b></span></div>
      ${packs(1)}
      <button type="button" class="cta">Pasūtīt 699,90 €</button>`},
  },
  {
    id:"14",
    title:"14. VIN kreisajā · pakas labajā",
    why:"Live max-width loģika, bet web ir 2 kolonnas. Atlikums - kluss teikums zem H1 kreisajā.",
    desk(){return `${nav("Sākums")}<div class="split">
      <div>
        <h2 class="h">Iesniegt VIN</h2>
        <p class="sub">Palikušas 7 Audita atskaites.</p>
        <span class="lab" style="margin-top:.85rem">VIN</span>
        <input class="field" value="WVWZZZ3CZWE123456"/>
        <button type="button" class="cta">Iesniegt</button>
      </div>
      <div>
        <h2 class="h">Pirkt vēl</h2>
        ${packs(1)}
        <button type="button" class="cta">Pasūtīt 10</button>
      </div>
    </div>`},
    phone(){return `${nav("Sākums")}
      <p class="sub">Palikušas 7.</p>
      <span class="lab">VIN</span><input class="field"/>
      <button type="button" class="cta">Iesniegt</button>
      <hr class="rule"/>
      ${packs(1)}
      <button type="button" class="cta ghost">Pirkt 10</button>`},
  },
  {
    id:"15",
    title:"15. Atlikums CTA palīgtekstā",
    why:"Poga paliek „Iesniegt”. Zem tās: „Tiks izmantota 1 no 7”. Pirkšana atsevišķi zemāk.",
    desk(){return `${nav("Sākums")}
      <h2 class="h">Iesniegt VIN</h2>
      <span class="lab">VIN</span><input class="field" value="WVWZZZ3CZWE123456"/>
      <button type="button" class="cta">Iesniegt</button>
      <p class="sub">Tiks izmantota 1 no 7 Audita atskaitēm.</p>
      <hr class="rule"/>
      <p class="lab">Papildināt</p>
      ${packs(1)}
      <button type="button" class="cta ghost">Pasūtīt 10</button>`},
    phone(){return `${nav("Sākums")}
      <span class="lab">VIN</span><input class="field"/>
      <button type="button" class="cta">Iesniegt</button>
      <p class="sub">1 no 7</p>`},
  },
  {
    id:"16",
    title:"16. Saraksts, ne kartes",
    why:"Pakas kā rindas (kā arhīva tabula), ne divas flīzes. Atlikums virsraksta otrajā rindiņā.",
    desk(){return `${nav("Atskaites")}
      <h2 class="h">PRO<span class="b">VIN</span> Audits</h2>
      <p class="sub">Atlikums: 7 atskaites</p>
      <div style="margin-top:.85rem">
        <div class="list-line"><span>1 atskaite</span><span><span class="u">79,99 €</span></span></div>
        <div class="list-line"><span>10 atskaites</span><span><span class="u">69,99 €</span> <span class="tot">kopā 699,90 €</span></span></div>
      </div>
      <button type="button" class="cta">Pasūtīt 10</button>`},
    phone(){return `${nav("Atskaites")}
      <p class="sub">Atlikums: 7</p>
      <div class="list-line"><span>1</span><span class="u">79,99 €</span></div>
      <div class="list-line"><span>10</span><span><span class="u">69,99 €</span> <span class="tot">699,90 €</span></span></div>
      <button type="button" class="cta">Pasūtīt 10</button>`},
  },
  {
    id:"17",
    title:"17. Tukšs konts: atlikums ir 0 teikumā",
    why:"Nav kredītu - VIN slēgts. Teikums vietā čipu. Uzreiz pakas.",
    desk(){return `${nav("Sākums")}
      <h2 class="h">Pieejamās atskaites</h2>
      <p class="sub">Atlikums ir 0. Lai iesniegtu VIN, vispirms iegādājies Audita atskaites.</p>
      ${packs(1)}
      <button type="button" class="cta">Pasūtīt atskaites 699,90 €</button>`},
    phone(){return `${nav("Sākums")}
      <p class="sub">Atlikums ir 0.</p>
      ${packs(1)}
      <button type="button" class="cta">Pasūtīt</button>`},
  },
  {
    id:"18",
    title:"18. Atlikums ekrāna kājenē",
    why:"Saturs: VIN + CTA. Atlikums paliek apakšā kā konta rindiņa, līdzīgi kājenei.",
    desk(){return `${nav("Sākums")}
      <h2 class="h">Iesniegt VIN</h2>
      <span class="lab">VIN</span><input class="field" value="WVWZZZ3CZWE123456"/>
      <button type="button" class="cta">Iesniegt</button>
      <div class="footbar"><span>PROVIN Audits</span><span>Atlikums 7</span></div>`},
    phone(){return `${nav("Sākums")}
      <span class="lab">VIN</span><input class="field"/>
      <button type="button" class="cta">Iesniegt</button>
      <div class="footbar"><span>Audits</span><span>Atlikums 7</span></div>`},
  },
  {
    id:"19",
    title:"19. Pirkšana: atlikums paku virsrakstā",
    why:"Atskaites sadaļa. H1 ietver skaitu: „Pirkt atskaites (7 kontā)”.",
    desk(){return `${nav("Atskaites")}
      <h2 class="h">Pirkt atskaites <span class="remain-quiet">(7 kontā)</span></h2>
      <p class="sub">Oficiālie dīleru dati ietilpst Audita atskaitē. Atsevišķa Dīlera paka šajā kontā nav.</p>
      ${packs(1)}
      <button type="button" class="cta">Pasūtīt atskaites 699,90 €</button>`},
    phone(){return `${nav("Atskaites")}
      <h2 class="h">Pirkt <span class="remain-quiet">(7)</span></h2>
      ${packs(1)}
      <button type="button" class="cta">Pasūtīt</button>`},
  },
  {
    id:"20",
    title:"20. Viena kolonna: atlikums · VIN · pirkums",
    why:"Viss stacked kā live mobile, web šaurāks. Atlikums ir pirmais teikums, ne UI čips.",
    desk(){return `${nav("Sākums")}
      <p class="sub" style="margin-bottom:.85rem">Kontā palikušas <span class="remain-inline">7 Audita atskaites</span>.</p>
      <h2 class="h">Iesniegt VIN</h2>
      <span class="lab">VIN</span><input class="field" value="WVWZZZ3CZWE123456"/>
      <button type="button" class="cta">Iesniegt</button>
      <hr class="rule"/>
      <h2 class="h" style="font-size:1.05rem">Papildināt atlikumu</h2>
      ${packs(0)}
      <button type="button" class="cta ghost">Pasūtīt 1 · 79,99 €</button>`},
    phone(){return `${nav("Sākums")}
      <p class="sub">Palikušas <span class="remain-inline">7</span>.</p>
      <span class="lab">VIN</span><input class="field"/>
      <button type="button" class="cta">Iesniegt</button>
      <hr class="rule"/>
      ${packs(0)}
      <button type="button" class="cta ghost">Pirkt 1</button>`},
  },
];

const root = document.getElementById("root");
V.forEach((v) => {
  const sec = document.createElement("section");
  sec.className = "section";
  sec.id = "v" + v.id;
  sec.innerHTML = `<h2>${v.title}</h2><p class="why">${v.why}</p>
    <div class="pair">
      <div><p class="device">Web</p><div class="stage desk"><span class="badge">V${v.id} · web</span>${v.desk()}</div></div>
      <div><p class="device">Telefons</p><div class="phone-frame"><div class="phone-inner"><span class="badge">V${v.id} · phone</span>${v.phone()}</div></div></div>
    </div>`;
  root.appendChild(sec);
});
</script>
</body>
</html>
