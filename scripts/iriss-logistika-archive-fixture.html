<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IRISS Loģistika arhīvs</title>
  <style>
    :root { --ink:#0b0c10; --ink2:#5e636e; --acc:#3d5bd9; --acc-soft:rgba(61,91,217,.12); --bg:#e9ecf1; }
    body { margin:0; font: 13px/1.35 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 0; }
    .row { display:flex; gap:8px; align-items:center; }
    .chip { border:0; background:#fff; border-radius:999px; padding:6px 10px; font-weight:600; }
    .chip.on { background:#111; color:#fff; }
    .grid { display:grid; grid-template-columns: 1fr 320px; gap:12px; margin-top:12px; }
    .card { background:#fff; border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .map { height:200px; background: linear-gradient(#cfd8c4,#d7e0ea); border-radius:14px; position:relative; margin:8px; }
    .dot { position:absolute; width:10px; height:10px; border-radius:50%; background:#9aa1ad; opacity:.55; }
    .lab { position:absolute; font-size:10px; font-weight:500; color:#1f2430; background:rgba(255,255,255,.62); padding:2px 6px; border-radius:6px; opacity:.55; }
    .item { display:flex; gap:8px; padding:10px 12px; border-top:1px solid #f3f4f6; }
    .item.archived { opacity:.55; }
    .wake { border:1px solid #e5e7eb; border-radius:999px; padding:4px 10px; background:#fff; font-weight:600; }
    .btn { background:#111; color:#fff; border:0; border-radius:999px; padding:8px 12px; font-weight:600; }
    a { color: var(--acc); font-weight:600; text-decoration:none; }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .aside { display:none; }
      .map { height:150px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="row"><h1>Loģistika</h1><span style="color:var(--acc);font-weight:700;font-size:12px">IRISS</span></div>
        <p style="margin:4px 0 0;color:var(--ink2);font-size:12px">8 aktīvi · 2 arhīvā · km</p>
      </div>
      <button class="btn">+ Nopirkts</button>
    </div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap">
      <button class="chip">Šodien jādara 2</button>
      <button class="chip">Termiņš tuvu 3</button>
      <button class="chip">Visi aktīvie 8</button>
      <button class="chip on">Arhīvs 2</button>
    </div>
    <div class="grid">
      <div>
        <div class="card">
          <div class="row" style="justify-content:space-between;padding:8px 12px">
            <span style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#9a9faa">KARTE</span>
            <button class="chip">Iepriekš izmantotie punkti</button>
          </div>
          <div class="map">
            <span class="dot" style="left:28%;top:42%"></span>
            <span class="lab" style="left:31%;top:38%">BMW iX · Openlane</span>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="item archived">
            <input type="checkbox" />
            <div style="flex:1">
              <strong>BMW iX</strong>
              <div>Openlane · Izņemts</div>
            </div>
            <button class="wake">Pamodināt</button>
          </div>
          <div class="item archived">
            <input type="checkbox" />
            <div style="flex:1">
              <strong>Audi A4 Avant</strong>
              <div>Autobid · Piegādāts</div>
            </div>
            <button class="wake">Pamodināt</button>
          </div>
        </div>
      </div>
      <aside class="card aside" style="padding:16px">
        <h2 style="margin:0 0 4px;font-size:18px">BMW iX</h2>
        <div style="font-family:ui-monospace;font-size:12px;color:var(--ink2)">WBY11CF060CM04850 · Openlane</div>
        <p>Arhīvs. Auto nav aktīvajā sarakstā.</p>
        <button class="btn">Pamodināt</button>
      </aside>
    </div>
  </div>
</body>
</html>
