<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390" />
  <title>Pirms: vecā mobilā josla</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f8f8f9; color: #000; }
    .phone { width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f9; }
    .status { height: 47px; padding: 14px 24px 0; font-size: 15px; font-weight: 600; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
    .tools input { height: 32px; flex: 1; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; padding: 0 8px; }
    .chip { height: 32px; padding: 0 8px; border-radius: 6px; background: #111; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
    .chip.g { background: #e5e7eb; color: #111; }
    .row { min-height: 76px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin: 8px; padding: 8px 10px; font-size: 16px; }
    .meta { font-size: 12px; color: #8e8e93; }
    .fab { position: absolute; right: 16px; bottom: 72px; width: 48px; height: 48px; border-radius: 12px; background: #007aff; color: #fff; display: grid; place-items: center; font-size: 26px; }
    .tab { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; border-top: 1px solid #e5e5ea; background: #fff; display: flex; }
    .tab a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #8e8e93; text-decoration: none; gap: 2px; }
    .tab a.on { color: #007aff; font-weight: 600; }
    .ico { width: 21px; height: 21px; border: 1.6px solid currentColor; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="status">09:41</div>
    <div class="tools">
      <input value="" placeholder="Meklēt (vārds, tālrunis, marka)" />
      <span class="chip">Aktīvi 8</span>
      <span class="chip g">Izpildīti 14</span>
      <span class="chip g">Neaktīvi 2</span>
      <span class="chip g">Kārtot</span>
      <span class="chip g">Atskaite</span>
      <span class="chip g">eCarsTrade</span>
    </div>
    <div class="row">BMW 530d xDrive<div class="meta">Jānis Bērziņš · 18 000 €</div></div>
    <div class="row">Audi A6 50 TDI<div class="meta">Anna Kalniņa · 16 500 €</div></div>
    <div class="row">Mercedes E220d<div class="meta">Pēteris Ozols · 22 000 €</div></div>
    <div class="fab">+</div>
    <nav class="tab">
      <a class="on"><i class="ico"></i>Pasūtījumi</a>
      <a><i class="ico"></i>Klientu filtri</a>
      <a><i class="ico"></i>Radars</a>
      <a><i class="ico"></i>PRO</a>
      <a><i class="ico"></i>Vairāk</a>
    </nav>
  </div>
</body>
</html>
