# Drop-in: /etc/systemd/system/iriss-vpn.service.d/20-servera-konts.conf (19.11, Nils)
# Serverim savs ĪRISS VPN konts. Piekļuves dati TIKAI serverī /root/iriss-vpn/creds-server (root 600), repo nav.
# Restart=on-failure pārraksta 10-no-restart.conf (savu kontu neviens neizmet).
[Service]
StandardInput=file:/root/iriss-vpn/creds-server
Restart=on-failure
RestartSec=30
