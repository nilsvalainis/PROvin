name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      # package-lock.json on main can drift from package.json (`npm ci` fails).
      - run: npm install
      - name: Vitest
        run: npm test
      - name: Typecheck
        # Non-blocking: tsc may already fail on main. Failures are still visible in the log.
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        # Vercel būvē arī CSS un webpack. Šī solī kļūdas parādās jau PR, nevis tikai Vercel.
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
