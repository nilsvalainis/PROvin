</style></head><body><h1>j64 - PRO mobilā sākumlapa, 10 varianti</h1><p class="s">Josla C un flīžu ikonas nemainītas. Atšķiras Pavadzīmju un Loģistikas vidžetu ģimene. Makets - kods tikai pēc Nila "jā".</p><div class="g"><figure><img src="01-aplis-un-taisne-pro.png"><figcaption><b>01 - Aplis un taisne</b>Pavadzīmes - 3 px apļi; Loģistika - tā pati 3 px līnija, taisna un sadalīta pēc kravu skaita.</figcaption></figure><figure><img src="02-stikls-pro.png"><figcaption><b>02 - Stikls</b>Abi vidžeti matētā stiklā: pavadzīmes - apaļas lēcas, loģistika - viena taisnstūra stikla josla ar 3 nodalījumiem.</figcaption></figure><figure><img src="03-spidometrs-un-limenis-pro.png"><figcaption><b>03 - Spidometrs un līmenis</b>Mērinstrumentu ģimene: pavadzīmes - 240° spidometra loki CSDD zaļā; loģistika - vertikāli līmeņa stabiņi kā degvielas skala.</figcaption></figure><figure><img src="04-aplis-un-kvadrats-pro.png"><figcaption><b>04 - Aplis un kvadrāts</b>Viens režģis, viena līnija: pavadzīmes - apļa progress (stundas); loģistika - noapaļota kvadrāta kontūra (daļa no visām kravām).</figcaption></figure><figure><img src="05-laika-ass-un-bloki-pro.png"><figcaption><b>05 - Laika ass un bloki</b>Pavadzīmes sakārtotas pēc atlikušā laika un savienotas ar vienu 0-48 h asi (steidzamākā kreisāk); loģistika - viens bloks = viena krava, sagrupēti pēc statusa.</figcaption></figure><figure><img src="06-tikai-cipari-pro.png"><figcaption><b>06 - Tikai cipari</b>Tipogrāfiskā ģimene bez formām: pavadzīmes - lieli cipari kolonnās; loģistika - viens teikums vienā rindā ar krāsainiem cipariem.</figcaption></figure><figure><img src="07-divi-stavi-pro.png"><figcaption><b>07 - Divi stāvi</b>Abi vidžeti vienā caurspīdīgā rāmī ar matu līniju starp tiem: augšā apļi (pavadzīmes), apakšā rindas ar svītru (loģistika). Divi atsevišķi pieskārieni.</figcaption></figure><figure><img src="08-pilni-laukumi-pro.png"><figcaption><b>08 - Pilni laukumi</b>Aizpildītas formas, bez kontūrām: pavadzīmes - pulksteņa sektori (atlikušais laiks); loģistika - viena aizpildīta josla, sadalīta pēc statusa.</figcaption></figure><figure><img src="09-marsruts-ar-tapam-pro.png"><figcaption><b>09 - Maršruts ar tapām</b>Pavadzīmes - apļi; loģistika - maršruta līnija ar Google Maps formas tapām (skaitlis tapā), kas sasaucas ar Loģistikas ikonu.</figcaption></figure><figure><img src="10-rindas-un-kolonnas-pro.png"><figcaption><b>10 - Rindas un kolonnas</b>Pavadzīmes - 3 rindas kā Apple Atgādinājumi (numurzīme, auto, joslas atlikums); loģistika - 3 kolonnas ar matu līnijām kā segmentu slēdzis.</figcaption></figure></div></body></html>
