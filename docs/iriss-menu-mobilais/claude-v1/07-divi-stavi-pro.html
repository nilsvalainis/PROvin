<!doctype html>
<html lang="lv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>07 Divi stāvi - PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:InterLocal;src:url(assets/Inter-Regular.ttf);font-weight:400}
@font-face{font-family:InterLocal;src:url(assets/Inter-Bold.ttf);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:852px;overflow:hidden}
body{font-family:Inter,InterLocal,-apple-system,sans-serif;color:#1c1c1e;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.screen{position:relative;width:390px;height:852px;overflow:hidden;padding:0 20px}
.iriss{background:linear-gradient(180deg,#eef1f6 0%,#e2e7ef 55%,#d6dde8 100%)}
.pro{background:linear-gradient(180deg,#e4e4ea 0%,#cfcfd6 100%)}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 44px}
.sb-t{font-size:17px;font-weight:600;letter-spacing:-.2px}
.island{position:absolute;left:50%;top:11px;width:125px;height:37px;margin-left:-62.5px;background:#000;border-radius:999px}
.sb-r{display:flex;gap:6px;align-items:center}
.hd{padding-top:60px;display:flex;align-items:center;gap:14px;height:108px}
.hd h1{font-size:34px;font-weight:700;letter-spacing:-.8px}
.seg{display:flex;background:rgba(118,118,128,.14);border-radius:999px;padding:3px;height:36px}
.seg span{min-width:62px;padding:0 14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#6e6e73;border-radius:999px}
.seg .on-i{background:#34c759;color:#fff}
.seg .on-p{background:#1c1c1e;color:#fff}
.w{display:block;position:relative}
.wp{margin-top:14px;padding:4px 0 2px}
.wl{margin-top:22px;padding:2px 0}
.wl.pt0{margin-top:20px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.col{display:flex;flex-direction:column;align-items:center;text-align:center}
.ringbox{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.ringbox>svg{position:absolute;top:50%;left:50%;translate:-50% -50%}
.ringbox>svg[style*="rotate(-90deg)"]{translate:none;top:auto;left:auto;position:static}
.ringc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.num{font-weight:600;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-weight:500;margin-left:1px;opacity:.75;letter-spacing:0}
.plate{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1.5px solid #d92d20;border-radius:6px;font-size:13px;font-weight:600;letter-spacing:.2px;color:#1c1c1e;background:rgba(255,255,255,.55);white-space:nowrap}
.car{display:block;margin-top:4px;font-size:13px;color:#6e6e73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab{display:block;font-size:13px;color:#6e6e73;margin-top:4px;white-space:nowrap}
.lh{display:flex;align-items:center;gap:6px;font-size:13px;color:#6e6e73;font-weight:500;margin-bottom:10px}
.lh .chev{margin-left:auto}
/* 01 */
.segline{display:flex;gap:8px}
.seg1{display:flex;flex-direction:column;min-width:0}
.seg1 .num{margin-bottom:8px}
.track{display:block;height:3px;border-radius:999px}
/* 02 */
.glass{background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.55)}
.glassbar{display:grid;grid-template-columns:repeat(3,1fr);border-radius:14px;height:76px}
.gcell{display:flex;align-items:center;gap:10px;padding-left:16px}
.gcell.sep{border-left:1px solid rgba(60,60,67,.12)}
.tick{width:3px;height:34px;border-radius:999px}
/* 03 */
.lv{gap:8px}
.lvl{display:flex;align-items:flex-end;gap:10px;padding-left:10px}
.lvtrack{position:relative;width:12px;height:54px;border-radius:6px;background:rgba(60,60,67,.12);overflow:hidden;display:block}
.lvtrack span{position:absolute;left:0;right:0;bottom:0;border-radius:6px;display:block}
/* 05 */
.axis{position:relative;height:150px}
.am{position:absolute;width:72px;display:flex;flex-direction:column;align-items:center}
.am .num{margin-bottom:5px}
.stem{position:absolute;width:1.5px;opacity:.5}
.axsvg{position:absolute;left:0;top:0;pointer-events:none}
.aline{position:absolute;left:14px;right:14px;top:121px;height:2px;border-radius:999px;background:rgba(60,60,67,.18)}
.adot{position:absolute;top:119px;width:8px;height:8px;border-radius:999px}
.atick{position:absolute;top:132px;white-space:nowrap;font-size:11px;color:#8e8e93;translate:-50% 0;font-variant-numeric:tabular-nums}
.blocks{display:flex;gap:14px}
.bgrp{display:flex;flex-direction:column}
.brow{display:flex;gap:5px}
.blk{flex:1;height:30px;border-radius:6px;min-width:0}
.bgrp .lab b{font-weight:600}
/* 06 */
.sentence{display:flex;align-items:baseline;gap:8px;flex-wrap:nowrap;padding:6px 0}
.sentence>svg{align-self:center;margin-right:2px}
.sw{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.lab2{font-size:15px;color:#6e6e73}
.dotsep{color:#aeaeb2;font-size:18px}
/* 07 */
.frame{margin-top:14px;border-radius:14px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.6)}
.frame .w{margin:0;padding:14px 10px}
.frame .wl{border-top:1px solid rgba(60,60,67,.12)}
.row2{flex-direction:row;align-items:center;gap:8px;text-align:left;justify-content:flex-start;padding-left:2px}
.row2 .ringbox{margin:0;flex:none}
.row2 .plate{height:20px;font-size:12px;padding:0 5px}
.row2 .car{font-size:12px;margin-top:3px}
.pc{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.lrow{padding-left:8px;gap:10px}
.vtick{width:4px;height:36px;border-radius:999px}
/* 08 */
.pierow{display:flex;align-items:center;gap:8px;height:40px}
.stack{display:flex;gap:3px;height:32px;border-radius:10px;overflow:hidden}
.stack>span{display:flex;align-items:center;padding-left:10px}
.stacklab{display:flex;gap:3px}
.stacklab .lab{padding-left:10px}
/* 09 */
.route{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding-top:4px}
.rline{position:absolute;left:16%;right:16%;top:46px;border-top:2px dashed rgba(60,60,67,.25)}
.rstop{position:relative;display:flex;flex-direction:column;align-items:center}
.rstop svg{position:relative;z-index:1}
.rnum{position:absolute;top:8px;left:0;right:0;text-align:center;z-index:2;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
/* 10 */
.rows{display:flex;flex-direction:column}
.rw{display:flex;align-items:center;gap:10px;height:44px;border-bottom:1px solid rgba(60,60,67,.10)}
.rw:last-child{border-bottom:0}
.rw .plate{flex:none}
.rbar{flex:1;height:4px;border-radius:999px;background:rgba(60,60,67,.12);overflow:hidden;display:block}
.rbar span{display:block;height:100%;border-radius:999px}
.rw .num{width:44px;text-align:right}
.hair .col{padding:2px 0}
.sepv{border-left:1px solid rgba(60,60,67,.14)}
/* režģis */
.grid{margin:30px -8px 0;display:grid;grid-template-columns:repeat(4,1fr);row-gap:16px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;min-height:44px}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ic-white{background:#fff}
.tl{margin-top:6px;font-size:12px;font-weight:500;color:#1c1c1e;white-space:nowrap;letter-spacing:-.1px}
.badge{position:absolute;top:-6px;left:calc(50% + 18px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#ff3b30;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
/* josla C */
.bar{position:absolute;left:50%;bottom:34px;margin-left:-88px;width:176px;height:48px;border-radius:999px;background:rgba(255,255,255,.97);display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.bb{width:52px;height:44px;display:flex;align-items:center;justify-content:center;color:#8e8e93}
.bb.on{color:#1c1c1e}
.hi{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:999px;background:#1c1c1e}
/* Vairāk */
.vt{font-size:34px;font-weight:700;letter-spacing:-.8px;padding-top:62px}
.sec{font-size:13px;font-weight:600;color:#6e6e73;letter-spacing:.4px;text-transform:uppercase;margin:22px 0 12px}
.vgrid{position:static;margin:0 -8px}
</style></head>
