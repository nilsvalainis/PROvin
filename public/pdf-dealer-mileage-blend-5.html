<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>PROVIN · dīlera līkne, 5 varianti</title>
<style>
  :root{--blue:#0061D2;--wash:#E8F1FC;--ink:#0f172a;--mute:#64748b;--line:#E9EDF3;--desk:#d7dee8;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--desk);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;}
  .chrome{position:sticky;top:0;z-index:20;background:#0f172a;color:#e2e8f0;padding:14px 18px 16px;}
  .chrome h1{margin:0;font-size:15px;font-weight:700;color:#fff;}
  .chrome p{margin:6px 0 0;font-size:12px;line-height:1.45;color:#94a3b8;max-width:70rem;}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tabs button{
    appearance:none;border:1px solid #334155;background:#1e293b;color:#e2e8f0;
    border-radius:999px;padding:5px 10px;font:650 11px/1.2 Inter,sans-serif;cursor:pointer;
  }
  .tabs button[aria-selected="true"]{background:#0061D2;border-color:#0061D2;color:#fff;}
  .nav{margin-top:8px;}
  .nav a{color:#93C5FD;font-size:12px;font-weight:650;}
  .hint{margin:8px 0 0;font-size:11px;color:#64748b;}
  .stage{padding:24px 12px 72px;}
  .sheet{display:none;width:210mm;max-width:100%;margin:0 auto;background:#fff;padding:14mm 12mm;box-shadow:0 16px 44px rgb(15 23 42 / .12);border-radius:4px;}
  .sheet.is-on{display:block;}
  .word{font-size:13px;font-weight:800;}
  .word b{color:var(--blue);}
  .kicker-doc{margin:2px 0 12px;font-size:9.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#6e6e73;}
  .cover{margin:0;padding:0 0 14px;border-radius:12px;background:linear-gradient(180deg,#E8F1FC 0%,#fff 88%);border:1px solid var(--line);overflow:hidden;}
  .cover-pad{padding:16px 16px 0;}
  .kicker{margin:0;font-size:9.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#6e6e73;}
  h3{margin:8px 0 0;font-size:22px;letter-spacing:-0.03em;}
  .meta{margin:6px 0 0;font-size:12px;color:#475569;}
  .chart{display:block;width:100%;height:auto;margin:0;}
  .span{
    display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
    margin:0 16px 16px;padding:10px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);
  }
  .span.ghost{border-color:transparent;background:rgb(255 255 255 / .55);margin-top:-6px;}
  .span.flush{margin:0;border:0;border-radius:0;background:transparent;padding:4px 16px 16px;}
  .span b{display:block;font-size:13px;}
  .span i{display:block;margin-top:2px;font-style:normal;font-size:9.5px;color:var(--mute);}
  .span .end{text-align:right;}
  .bar{width:64px;height:2px;border-radius:99px;background:#93C5FD;}
  .body{padding:0 16px 16px;font-size:11.5px;color:#475569;line-height:1.45;}
  @media print{
    body{background:#fff;} .chrome{display:none;} .sheet{display:none;box-shadow:none;width:auto;padding:0;}
    .sheet.is-on{display:block;}
    @page{size:A4;margin:12mm;}
  }
</style>
</head>
<body>
  <div class="chrome">
    <h1>Nobraukuma līkne uz dīlera zilā vāka</h1>
    <p>Pieci veidi, kā līkne saplūst ar #E8F1FC bez grafika rāmja. Zem tās paliek tā pati km josla. Produkcijā nekas nav mainīts.</p>
    <div class="tabs" id="tabs"></div>
    <p class="hint" id="hint"></p>
    <div class="nav"><a href="/pdf-source-tint-concepts.html">Atpakaļ uz avotu krāsām</a></div>
  </div>
  <div class="stage" id="stage"></div>
<script>
const PTS = [
  { t: 0.00, km: 31400, d: "03.04.2016" },
  { t: 0.42, km: 58140, d: "05.09.2019" },
  { t: 0.86, km: 109880, d: "01.06.2023" },
  { t: 0.94, km: 128410, d: "01.12.2023" },
  { t: 1.00, km: 142220, d: "12.03.2024" },
];
const KM0 = 28000, KM1 = 148000;
function xy(p, w, h, pad){
  const x = pad + p.t * (w - pad * 2);
  const y = pad + (1 - (p.km - KM0) / (KM1 - KM0)) * (h - pad * 2);
  return [x, y];
}
function path(w, h, pad){
  const pts = PTS.map((p) => xy(p, w, h, pad));
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const cx = (x0 + x1) / 2;
    d += ` C ${cx.toFixed(1)} ${y0.toFixed(1)}, ${cx.toFixed(1)} ${y1.toFixed(1)}, ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  return { d, pts };
}
function span(cls){
  return `<div class="span ${cls || ""}">
    <div><b>31 400 km</b><i>03.04.2016</i></div>
    <div class="bar"></div>
    <div class="end"><b>142 220 km</b><i>12.03.2024 · 8 vizītes</i></div>
  </div>`;
}
function head(){
  return `<div class="cover-pad">
    <p class="kicker">PROVIN DĪLERIS</p>
    <h3>BMW X1 (E84) xDrive 20 d</h3>
    <p class="meta">VIN WBAVL12090VX12345 · A96 · 135 kW (184 ZS)</p>
  </div>`;
}

function chartA(){
  const w = 640, h = 120, pad = 18;
  const { d, pts } = path(w, h, pad);
  const last = pts[pts.length - 1];
  const area = `${d} L ${last[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-label="Nobraukuma līkne">
    <defs>
      <linearGradient id="fa" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0061D2" stop-opacity="0.22"/>
        <stop offset="1" stop-color="#E8F1FC" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#fa)"/>
    <path d="${d}" fill="none" stroke="#0061D2" stroke-width="2.2" stroke-linecap="round"/>
  </svg>`;
}
function chartB(){
  const w = 640, h = 110, pad = 20;
  const { d, pts } = path(w, h, pad);
  const dots = pts.map(([x,y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="#fff" stroke="#0061D2" stroke-width="1.8"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <path d="${d}" fill="none" stroke="#0061D2" stroke-width="2" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}
function chartC(){
  const w = 640, h = 132, pad = 22;
  const { d, pts } = path(w, h, pad);
  const area = `${d} L ${pts[pts.length-1][0].toFixed(1)} ${h-8} L ${pts[0][0].toFixed(1)} ${h-8} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <defs>
      <linearGradient id="fc" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#93C5FD" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#E8F1FC" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#fc)"/>
    <path d="${d}" fill="none" stroke="#0061D2" stroke-width="2.4"/>
  </svg>`;
}
function chartD(){
  const w = 640, h = 96, pad = 16;
  const { d, pts } = path(w, h, pad);
  const area = `${d} L ${w} ${h} L 0 ${h} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <defs>
      <linearGradient id="fd" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0061D2" stop-opacity="0.16"/>
        <stop offset="1" stop-color="#E8F1FC" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#fd)"/>
    <path d="${d}" fill="none" stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;
}
function chartE(){
  const w = 640, h = 88, pad = 14;
  const { d, pts } = path(w, h, pad);
  const area = `${d} L ${pts[pts.length-1][0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z`;
  const years = [["2016", pts[0]], ["2019", pts[1]], ["2023", pts[2]], ["2024", pts[4]]];
  const ticks = years.map(([lab, p]) =>
    `<text x="${p[0].toFixed(1)}" y="${h-4}" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter,sans-serif">${lab}</text>`
  ).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <defs>
      <linearGradient id="fe" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0061D2" stop-opacity="0.28"/>
        <stop offset="1" stop-color="#E8F1FC" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#fe)"/>
    <path d="${d}" fill="none" stroke="#0061D2" stroke-width="2"/>
    ${ticks}
  </svg>`;
}

const VARIANTS = [
  { id:"01", name:"01 Laukums izplūst", hint:"Līkne ar zilu laukumu, kas kļūst caurspīdīgs pret vāka fonu. Josla paliek baltā kartītē.",
    html: () => `${head()}${chartA()}${span("")}<p class="body">Grafikam nav rāmja, ass vai režģa. Tā ir tikai forma uz zilā.</p>` },
  { id:"02", name:"02 Punkti uz vizītēm", hint:"Tikai līnija un 5 servisa punkti. Mazāk 'grafiks', vairāk hronoloģija.",
    html: () => `${head()}${chartB()}${span("")}<p class="body">Katrs punkts ir vizīte. Bez laukuma, bez režģa.</p>` },
  { id:"03", name:"03 Josla iekš zilā", hint:"Laukums līdz pašai joslai. Joslai nav rāmja, tā sēž uz tā paša fona.",
    html: () => `${head()}${chartC()}${span("flush")}<p class="body">Km skaitļi kļūst par līknes parakstu, ne atsevišķu kartīti.</p>` },
  { id:"04", name:"04 Plāna kalna mala", hint:"Zema, klusa līkne. Josla pustumšā baltā, it kā peld uz fona.",
    html: () => `${head()}${chartD()}${span("ghost")}<p class="body">Mazāk kontrasta. Der, ja vāks jau ir pietiekami spēcīgs.</p>` },
  { id:"05", name:"05 Gadi kā ass", hint:"Laukums + gadu paraksti 2016-2024 tieši uz zilā. Josla zem tiem.",
    html: () => `${head()}${chartE()}${span("")}<p class="body">Gadi pieder līknei, km josla paliek kā kopsavilkums.</p>` },
];

const tabs = document.getElementById("tabs");
const stage = document.getElementById("stage");
VARIANTS.forEach((v, i) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = v.name;
  btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
  btn.addEventListener("click", () => show(v.id));
  tabs.appendChild(btn);
  const art = document.createElement("article");
  art.className = "sheet" + (i === 0 ? " is-on" : "");
  art.id = "sheet-" + v.id;
  art.innerHTML = `<div class="word">PRO<b>VIN</b>.LV</div><p class="kicker-doc">Koncepts · nav produkcija</p><section class="cover">${v.html()}</section>`;
  stage.appendChild(art);
});
function show(id){
  document.querySelectorAll(".sheet").forEach((el) => el.classList.toggle("is-on", el.id === "sheet-" + id));
  document.querySelectorAll(".tabs button").forEach((btn, i) => {
    btn.setAttribute("aria-selected", VARIANTS[i].id === id ? "true" : "false");
  });
  const v = VARIANTS.find((x) => x.id === id);
  document.getElementById("hint").textContent = v.hint;
}
show("01");
</script>
</body>
</html>
